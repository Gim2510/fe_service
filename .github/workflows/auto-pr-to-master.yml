name: Auto PR - master

on:
  push:
    branches:
      - dev

jobs:
  create-or-update-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create PR dev to master (skip if exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh pr list \
            --base master \
            --head dev \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already open for dev -> master. Skip."
            exit 0
          fi

          COMMITS=$(git log origin/master..HEAD --oneline | head -20)

          BODY=$(printf "## Automated release\n\nAuto-generated PR after merge to dev.\n\n## Commits\n%s\n\n## Checklist\n- [ ] All tests pass on dev\n- [ ] Review complete\n- [ ] No undocumented breaking changes" "$COMMITS")

          gh pr create \
            --base master \
            --head dev \
            --title "Release: dev -> master" \
            --body "$BODY"
