name: Security audit

on:
  push:
    branches: [dev, master]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full audit report (info only)
        run: npm audit || true

      - name: Fail on high/critical vulnerabilities
        run: npm audit --audit-level=high
